<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><img src="https://5.imimg.com/data5/QP/QD/EO/SELLER-13454000/telangana-english-map.png" alt="" width="50">
    <h2>TELANGANA STATE ROAD TRANSPORT CORPORAATION</h2>
    <h3>GENERAL BUS PASS APPLICATION</h3>
    </center>
    <form action="./tsrtc.html">
        <fieldset>
            <legend>Application Details</legend>
            <label for="">Name : &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
            <input type="text" name="Name">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label for="">father's Name/guradiar's</label>
            <input type="text" name=""><br>
            <label for="">Date of birth:&nbsp;</label>
            <input type="date" name="" id="">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label for="">Gender</label>
            <input type="radio" name="gend" value="Male">
            <label for="gend">Male</label>
            <input type="radio" name="gend" value="FeMale">
            <label for="">Female</label><br>
            <label for="">Age As on&nbsp;&nbsp;&nbsp;</label>
            <input type="text">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label for="">Aadhar No:</label>
            <input type="tel" ><br>
            <label for="">WhatsApp no</label>
            <input type="tel">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label for="email">E-mail id</label>
            <input type="email"><br>
            <label for="">photo</label>
            <input type="file" name="" id="">
        </fieldset>
        <fieldset>
            <legend>Residental Address Details</legend>
            <label for="Address">Applicant's address</label>
            <textarea name="address" id="Address"></textarea>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label for="">District</label>
            <select name="District" id="">
                <option value="" selected disabled>--select--</option>
                <option value="">HyYDERABAD</option>
                <option value="">ADILABAD</option>
                <option value="">MEDAK</option>
                <option value="">SANGAREDDY</option>
            </select><br>
            <label for="">Mandal</label>
            <select name="" id="">
                <option value="" selected disabled>--select--</option>
                <option value="">JINNARAM</option>
                <option value="">GUMMADIDALA</option>
                <option value="">MEDAK</option>
                <option value="">MEDCHAL</option>
            </select>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label for="">village</label>
            <select name="" id="">
                <option value="" selected disabled>--select--</option>
                <option value="">KORLAKUNTA</option>
                <option value="">NALTHUR</option>
                <option value="">JINNARAM</option>
                <option value="">KISTAYPALLI</option>
            </select><br>
            <label for="">pincode</label>
            <input type="text">
        </fieldset>
        <fieldset>
            <legend>Pass Type Details</legend>
            <label for="">City</label>
            <select name="" id="">
                <option value="" selected disabled>--select--</option>
                <option value="">HYDERABAD</option>
                <option value="">ADILABAD</option>
                <option value="">MEDAK</option>
                <option value="">SANGAREDDY</option>
            </select>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label for="">Pass Type</label>
            <select name="" id="">
                <option value="" selected disabled>--select--</option>
                <option value="">GREATER PASS</option>
                <option value="">GREATER ORDINARY ROUTE PASS</option>
                <option value="">ORDINARY pass</option>
                <option value="">METRO PASS</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Mode Of Payment & Pass Collection</legend>
            <label for="">Payment Mode</label>
            <select name="" id="">
                <option value="" selected disabled>--select--</option>
                <option value="">Payment At Counter</option>
            </select>
            <label for="">Pass Delivery Mode</label>
            <select name="" id="">
                <option value="" selected disabled>--select--</option>
                <option value="">At Counter</option>
            </select><br>
            <label for="">Center at which you want to collect pass</label>
            <select name="" id="">
                <option value="" selected disabled>--select--</option>
                <option value="">RTC SHAPUR NAGAR</option>
                <option value="">RTC SUCHITRA</option>
                <option value="">RTC KUKATPALLY</option>
                <option value="">RTC BALANAGAR</option>
            </select>
        </fieldset>
        <center>
        <img src="https://www.researchgate.net/profile/Hwan-Gue-Cho/publication/224351698/figure/fig2/AS:571184220524544@1513192338732/A-sample-transparent-CAPTCHA-Image-600-x-400-with-Randomly-Assigned-Text-in-Step-4.png" alt="" width="100">
        <img src="https://media.gettyimages.com/id/1663358018/vector/captcha-i-am-not-a-robot-vector-computer-code.jpg?s=612x612&w=gi&k=20&c=PTvIgzMKJU2rP6EKD-6ZYCx2c1qRsWHsmlCTOJhYT4o=" alt="" width="50"><br>
        <input type="text"><br>
        <button>submit</button>
        </center>
    </form>

</html>
